<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITN MOVEMENT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0b4b66">
<style>
:root{--teal:#0b4b66;--orange:#c84c0e;--orange-d:#a83f0b;--orange-bg:#fbede6;--grey:#eee;--ink:#0b0c0c;--text:#363636;--muted:#787878;--line:#d6d5d4;--field:#505a5f;--white:#fff;--dis:#c5c5c5;--ok:#00703c;--ok-bg:#e6f2eb;--bad:#b91900;--bad-bg:#fae6e3;--warn:#9e5f00;--warn-bg:#fff3e0;--info:#0057bd;--info-bg:#e3eefb;
--sh-sm:0 1px 2px rgba(0,0,0,.16);--sh-md:0 2px 8px rgba(0,0,0,.18);--sh-lg:0 12px 36px rgba(0,0,0,.28);
--disp:'Roboto Condensed','Roboto',system-ui,sans-serif;--body:'Roboto',-apple-system,'Segoe UI',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--body);color:var(--text);background:#d9dde0;height:100%;overflow:hidden}
.phone{position:absolute;left:50%;top:50%;width:410px;height:864px;padding:10px;background:#111;border-radius:48px;box-shadow:var(--sh-lg),inset 0 0 0 2px #333;transform:translate(-50%,-50%) scale(var(--s,1))}
.screen{position:relative;width:390px;height:844px;background:var(--grey);border-radius:38px;overflow:hidden}
#app{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:0}
.appbar{flex:0 0 auto;background:var(--teal);color:#fff;padding:12px 12px 12px 6px;min-height:64px;display:flex;align-items:center;gap:6px}
.ico-btn{width:42px;height:42px;border:none;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.ico-btn:active{background:rgba(255,255,255,.14)}
.titles{min-width:0;flex:1}
.eyebrow{font:400 11.5px/1.2 var(--body);color:rgba(255,255,255,.72)}
.title{font:500 19px/1.2 var(--body);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;min-height:0;overflow-y:auto;background:var(--grey)}
.footer{flex:0 0 auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -1px 4px rgba(0,0,0,.08);padding:14px;display:flex;gap:10px}
.btn{font:500 18px/1 var(--body);border:none;border-radius:6px;padding:0 18px;height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--orange);color:#fff;flex:1}.btn-primary:active{background:var(--orange-d)}
.btn:disabled{background:var(--dis);color:#fff}
.btn-ghost{background:#fff;color:var(--orange);border:1px solid var(--orange)}
.btn-block{width:100%}.btn-sm{height:42px;font-size:15.5px}
.hero{background:var(--grey);padding:0 16px 4px}
.hero::before{content:"ITN MOVEMENT";display:flex;align-items:center;height:64px;margin:0 -16px 22px;padding:0 18px;background:var(--teal);color:#fff;font:500 19px/1 var(--body)}
.hero h1{font:700 30px/1.12 var(--disp);color:var(--teal);margin-bottom:10px}
.hero p{display:inline-block;font:400 13px/1.5 var(--body);color:var(--info);background:var(--info-bg);border-radius:4px;padding:7px 11px}
.list{padding:18px 14px 28px}
.list h2{font:700 28px/1.12 var(--disp);color:var(--teal)}
.sub{font:400 13.5px/1.5 var(--body);color:var(--muted);margin:6px 0 16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:var(--sh-sm)}
.field{margin-bottom:14px}
.lbl{font:400 16px var(--body);margin-bottom:8px}.lbl .req{color:var(--bad)}
.field input,.field select{width:100%;height:48px;font:400 16px var(--body);color:var(--ink);padding:0 14px;border:1px solid var(--field);border-radius:4px;background:#fff;outline:none}
.field input:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.flag{font:400 14px/1.4 var(--body);padding:9px 12px;border-radius:4px;margin-bottom:12px;display:block}
.flag.bad{background:var(--bad-bg);color:var(--bad)}.flag.ok{background:var(--ok-bg);color:var(--ok)}
.menu-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-family:var(--body);background:#fff;border:none;border-radius:12px;padding:16px 12px 16px 16px;margin-bottom:12px;cursor:pointer;box-shadow:var(--sh-sm)}
.menu-card:active{box-shadow:var(--sh-md)}
.menu-card .mi{width:40px;height:40px;display:grid;place-items:center;color:var(--orange);align-self:flex-start}
.menu-card .mt{flex:1;min-width:0}
.menu-card h3{font:500 17px/1.2 var(--body);color:var(--teal);margin-bottom:4px}
.menu-card span{font:400 13px/1.45 var(--body);color:var(--muted);display:block}
.menu-card .mm{font:400 12.5px/1 var(--body);color:var(--ok);background:var(--ok-bg);margin-top:10px;display:inline-block;border-radius:4px;padding:7px 9px}
.menu-card .ma{color:var(--teal)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:12px;padding:15px;box-shadow:var(--sh-sm)}
.stat .n{font:700 27px/1 var(--disp);color:var(--teal)}.stat .n.g{color:var(--ok)}.stat .n.w{color:var(--warn)}
.stat .l{font:400 12.5px/1.35 var(--body);color:var(--muted);margin-top:7px}
.ring-track{height:10px;background:#d6d5d4;border-radius:99px;overflow:hidden;margin-top:10px}
.ring-fill{height:100%;background:var(--orange);border-radius:99px}.ring-fill.full{background:#00a651}
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--grey)}
.row:last-child{border-bottom:none}
.row .sn{width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font:700 13px var(--disp);flex:0 0 auto;background:var(--teal)}
.row .sn.in{background:#ffa000}.row .sn.out{background:#00a651}
.row .sm{flex:1;min-width:0}.row .t{font:500 14px var(--body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font:400 12px var(--body);color:var(--muted);margin-top:2px}
.row .q{font:700 18px var(--disp);color:var(--teal)}
.chip{display:inline-block;font:500 12px/1 var(--body);padding:6px 9px;border-radius:4px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.w{background:var(--warn-bg);color:var(--warn)}
.card h4{font:500 16px var(--body);color:var(--teal);margin-bottom:6px}
.empty{text-align:center;color:var(--muted);font:400 14px/1.5 var(--body);padding:18px 0}
.ovl{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:80;padding:22px}
.sheet{width:100%;max-width:420px;background:#fff;border-radius:12px;padding:22px 18px 18px;box-shadow:var(--sh-lg)}
.sheet h3{font:700 22px/1.2 var(--disp);color:var(--teal);margin-bottom:8px}
.sheet p{font:400 14px/1.5 var(--body);margin-bottom:13px}
.sheet .acts{display:flex;gap:10px;margin-top:16px}.sheet .acts .btn{flex:1}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#323232;color:#fff;font:400 14px var(--body);padding:12px 18px;border-radius:4px;opacity:0;pointer-events:none;transition:.25s;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.app-ver{flex:0 0 auto;text-align:center;white-space:nowrap;overflow:hidden;font:400 10px/1.4 var(--body);color:var(--muted);padding:12px 6px calc(14px + env(safe-area-inset-bottom));background:var(--grey)}
.ver{text-align:center;font:400 11px/1.4 var(--body);color:var(--muted);margin-top:14px}
.uat{position:absolute;top:0;right:0;width:84px;height:84px;overflow:hidden;pointer-events:none;z-index:95}
.uat span{position:absolute;top:17px;right:-30px;width:120px;transform:rotate(45deg);background:#4caf50;color:#fff;font:700 11px/1 var(--body);letter-spacing:.06em;text-align:center;padding:5px 0}
.appbar{padding-right:60px;align-items:center}
.appbar .titles{padding-left:10px}
.appbar .title{white-space:normal;overflow:visible;text-overflow:clip;font:500 15px/1.3 var(--body);word-break:break-word;margin-top:3px}
.tabs{flex:0 0 auto;display:flex;background:#083a50}
.tab{flex:1;height:44px;border:none;background:transparent;color:rgba(255,255,255,.7);font:500 12px var(--body);letter-spacing:.04em;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:#fff;border-bottom-color:var(--orange)}
.badge{background:var(--orange);color:#fff;border-radius:9px;font-size:10px;padding:2px 5px;margin-left:3px}
.footer .btn{flex:1}
.plate{display:inline-block;background:#1a56b8;color:#fff;font:700 26px var(--disp);letter-spacing:.08em;padding:8px 20px;border-radius:6px;border:3px solid #fff;outline:2px solid #1a56b8;min-width:130px;text-align:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--grey);font-size:14px}.kv:last-child{border:none}.kv b{color:var(--ink);text-align:right}
.banner{background:var(--ok);color:#fff;border-radius:8px;padding:12px 14px;font:500 15px var(--body);margin-bottom:14px}
.qrbox{text-align:center;padding:6px 0 10px}.qrbox svg{width:168px;height:168px;background:#fff}
.vcode{font:700 30px var(--disp);letter-spacing:.18em;color:var(--teal);text-align:center}
.step{font:700 13px var(--body);letter-spacing:.08em;color:var(--orange);margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf video{width:100%;height:100%;object-fit:cover;display:block}
.vf{width:230px;height:230px;margin:14px auto;border:3px solid var(--orange);border-radius:12px;position:relative;overflow:hidden;background:#222}
.vf::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--orange);animation:sc 1.4s linear infinite}
@keyframes sc{from{top:0}to{top:100%}}
.big{font:700 54px/1 var(--disp);text-align:center;color:var(--teal)}
.field input[readonly]{background:var(--grey);color:var(--muted)}
.sec{font:700 13px var(--body);letter-spacing:.08em;color:var(--teal);margin:6px 0 10px}
.wl{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 22%,#14698d 0%,#0b4b66 48%,#06303f 100%);overflow:hidden}
.wl::before,.wl::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.08)}
.wl::before{width:420px;height:420px;top:-120px;left:50%;margin-left:-210px}.wl::after{width:620px;height:620px;top:-220px;left:50%;margin-left:-310px}
.wl-top{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px 8px;text-align:center;color:#fff;position:relative;z-index:1}
.wl-logo{width:160px;height:160px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px rgba(255,255,255,.14),0 0 0 16px rgba(255,255,255,.07),0 10px 28px rgba(0,0,0,.35)}
.wl-logo img{width:100%;height:100%;display:block;border-radius:50%}
.wl-top h1{font:700 34px/1.1 var(--disp);margin-top:28px;letter-spacing:.01em}
.wl-top .sb{font:400 14px/1.4 var(--body);color:rgba(255,255,255,.82);margin-top:8px}
.wl-steps{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.wl-steps span{font:500 11.5px/1 var(--body);color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:7px 11px}
.wl-steps b{color:#ffb089;margin-right:4px}
.wl-sheet{position:relative;z-index:2;background:#fff;border-radius:30px 30px 0 0;padding:22px 20px 0;box-shadow:0 -8px 26px rgba(0,0,0,.22);flex:0 0 auto}
.wl-sheet::before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:var(--line);margin:-10px auto 14px}
.wl-sheet p{font:400 14.5px/1.55 var(--text);color:var(--text)}.wl-sheet p b{color:var(--teal)}
.wl-act{display:flex;gap:10px;margin:18px 0 6px}.wl-act .btn{flex:1}.wl-act .btn-ghost{color:var(--teal);border-color:var(--line)}.wl-act .btn-primary{flex:1.4}
.wl-ft{text-align:center;white-space:nowrap;overflow:hidden;font:400 10px/1.4 var(--body);color:var(--muted);padding:10px 6px calc(14px + env(safe-area-inset-bottom))}
.appbar{min-height:50px!important;padding:6px 60px 4px 14px!important}
.appbar .titles{padding-left:0!important}
.appbar .title{font:500 13px/1 var(--body)!important;letter-spacing:.08em;color:rgba(255,255,255,.75);margin:0!important}
.profile{flex:0 0 auto;background:var(--teal);color:#fff;font:500 16px/1.3 var(--body);white-space:nowrap;overflow:hidden;padding:0 14px 10px 14px}
</style>
</head>
<body>
<div class="phone"><div class="screen">
  <div id="app"></div><div id="modal"></div><div class="toast" id="toast"></div>
  <div class="uat"><span>UAT</span></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const KEY='itn_movement_v2';
const DISTRICTS=['Bo','Bombali','Bonthe','Falaba','Kailahun','Kambia','Karene','Kenema','Koinadugu','Kono','Moyamba','Port Loko','Pujehun','Tonkolili','Western Area Rural','Western Area Urban'];
const GEO={Bo:{'Kakua':['Kakua CHC','Njala Road CHP'],'Bo Town':['Bo Govt Hospital','Mattru Jong CHC'],'Badjia':['Badjia CHC','Gerihun CHC']},
 Kenema:{'Nongowa':['Kenema Govt Hospital','Hangha CHC'],'Dama':['Dama CHC']},
 Bombali:{'Bombali Sebora':['Rogbaneh CHC','Makeni Govt Hospital']}};
let S={me:null,disp:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
let ui={tab:'dash',step:1,d:{},rec:null,off:false,fresh:false};
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VER='<div class="app-ver">Version 1.0 · Powered by DIGIT HCM &amp; ICF-SL</div>';
const fmt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const qty=r=>r.dual+r.std,pend=()=>S.disp.filter(r=>!r.synced).length;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}
function modal(h){$('modal').innerHTML=`<div class="ovl"><div class="sheet">${h}</div></div>`;}
const closeModal=()=>$('modal').innerHTML='';
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}
/* QR */
function qrM(t){
  if(window.qrcode){const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount();return Array.from({length:n},(_,r)=>Array.from({length:n},(_,c)=>q.isDark(r,c)));}
  let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))>>>0;const n=25;
  const f=(r,c)=>(r<8&&c<8)||(r<8&&c>16)||(r>16&&c<8);
  return Array.from({length:n},(_,r)=>Array.from({length:n},(_,c)=>{if(f(r,c)){const a=r>16?r-18:r,b=c>16?c-18:c;return a==0||a==6||b==0||b==6||(a>1&&a<5&&b>1&&b<5)&&a<7&&b<7;}h=(h*1103515245+12345)>>>0;return h>>>16&1;}));
}
const qrText=r=>`ITN|${r.id}|${r.district}|${r.chiefdom}|${r.phu}|D${r.dual}|S${r.std}|${r.code}`;
function qrSvg(r){const m=qrM(qrText(r)),n=m.length;let p='';m.forEach((row,y)=>row.forEach((v,x)=>{if(v)p+=`M${x+2} ${y+2}h1v1h-1z`;}));return `<svg viewBox="0 0 ${n+4} ${n+4}" shape-rendering="crispEdges"><path d="${p}" fill="#000"/></svg>`;}
function dlQR(id){const r=S.disp.find(x=>x.id===id),m=qrM(qrText(r)),n=m.length,k=10,c=document.createElement('canvas');c.width=c.height=(n+4)*k;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';m.forEach((row,y)=>row.forEach((v,x)=>{if(v)g.fillRect((x+2)*k,(y+2)*k,k,k);}));c.toBlob(b=>dl(b,r.id+'-QR.png'));toast('QR image saved');}
function dlPDF(id){const r=S.disp.find(x=>x.id===id);
  const L=['ICF-SL ITN MOVEMENT RECEIPT','','Dispatch ID: '+r.id,'Date & Time: '+fmt(r.t),'District: '+r.district,'Chiefdom: '+r.chiefdom,'Health Facility / PHU: '+r.phu,'Dual-AI ITNs: '+r.dual,'Standard ITNs: '+r.std,'Total ITNs: '+qty(r),'Vehicle Plate: '+r.plate,'Conveyor: '+r.conv,'Verification Code: '+r.code].map(x=>x.replace(/[^\x20-\x7e]/g,'-'));
  let c='BT /F1 13 Tf 50 780 Td 20 TL\n';L.forEach(l=>c+='('+l.replace(/[()\\]/g,'\\$&')+') Tj T*\n');c+='ET';
  const o=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>','<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>','<</Length '+c.length+'>>stream\n'+c+'\nendstream','<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>'];
  let p='%PDF-1.4\n',off=[];o.forEach((x,i)=>{off.push(p.length);p+=(i+1)+' 0 obj\n'+x+'\nendobj\n';});const xr=p.length;
  p+='xref\n0 6\n0000000000 65535 f \n'+off.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF';
  dl(new Blob([p],{type:'application/pdf'}),r.id+'.pdf');toast('PDF saved');}
/* shell */
function shell(inner,foot){
  const m=S.me,tabs=[['dash','DASHBOARD'],['disp','DISPATCH'],['rec','RECORDS'],['sync','SYNC']];
  app.innerHTML=`<div class="appbar"><div class="titles"><div class="title">ITN MOVEMENT</div></div><button class="ico-btn" title="Sign out" onclick="signOut()"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></button></div>
  <div class="profile" id="pf">Name: ${esc(m.name)}${m.id?` - ID: ${esc(m.id)}`:''} - Role: ${esc(m.role)} - District: ${esc(m.district)}</div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${ui.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}${t[0]==='sync'&&pend()?`<span class="badge">${pend()}</span>`:''}</button>`).join('')}</div>
  <div class="body" id="bd"><div class="list">${inner}</div></div>${foot?`<div class="footer">${foot}</div>`:''}${VER}`;
  const pf=$('pf');let z=15;pf.style.fontSize=z+'px';while(pf.scrollWidth>pf.clientWidth&&z>6){z-=.25;pf.style.fontSize=z+'px';}
}
function go(t){ui.tab=t;ui.rec=null;ui.fresh=false;if(t==='disp'){ui.step=1;ui.d={};}render();}
function render(){
  if(!S.me)return ui.seen?login():welcome();
  if(ui.rec)return receipt();

/* login */
function login(){
  app.innerHTML=`<div class="body"><div class="hero"></div><div class="list" style="padding-top:34px"><div class="card" style="text-align:center"><h4 style="font-size:19px;margin-bottom:6px">Sign in</h4><div class="sub" style="margin:0 0 16px">Scan your staff QR ID card to continue.</div><button class="btn btn-primary btn-block" onclick="scan()">SCAN QR ID CARD</button></div></div></div>${VER}`;
}
let stream=null,raf=0,bad='';
function stopScan(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function cancelScan(){stopScan();closeModal();}
function parseCard(t){
  t=String(t||'').trim();let n,i,r,d;
  try{const j=JSON.parse(t),g=k=>{const f=Object.keys(j).find(x=>x.toLowerCase()===k);return f?String(j[f]).trim():'';};n=g('name');i=g('id');r=g('role');d=g('district');}catch(e){}
  if(!(n&&r&&d)){
    const p=t.split(/\s*[|;,\n]\s*|\s+[-–—]\s+/).map(x=>x.trim()).filter(Boolean);
    if(p.some(x=>/^(name|id|role|district)\s*[:=]/i.test(x))){p.forEach(x=>{const m=x.match(/^(name|id|role|district)\s*[:=]\s*(.*)$/i);if(!m)return;const k=m[1].toLowerCase(),v=m[2].trim();if(k==='name')n=v;else if(k==='id')i=v;else if(k==='role')r=v;else d=v;});}
    else if(p.length>=4){[n,i,r,d]=p;}
    else if(p.length===3){[n,r,d]=p;}
  }
  return n&&r&&d?{name:n,id:i||'',role:r,district:d}:null;
}
function onCode(t){
  const c=parseCard(t);
  if(!c){if(t!==bad){bad=t;toast('Unrecognised ID card');}return false;}
  stopScan();closeModal();S.me=c;save();ui={tab:'dash',step:1,d:{},rec:null,off:false,fresh:false};render();toast('Signed in as '+c.name);return true;
}
async function decodeCanvas(cv){
  if(window.BarcodeDetector){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(cv);if(r[0])return r[0].rawValue;}catch(e){}}
  if(window.jsQR){const g=cv.getContext('2d').getImageData(0,0,cv.width,cv.height),q=jsQR(g.data,cv.width,cv.height);if(q)return q.data;}
  return null;
}
function scan(){
  bad='';
  modal(`<h3>Scan QR ID card</h3><p id="smsg">Align your staff QR ID card within the camera view.</p><div class="vf"><video id="sv" playsinline muted></video></div><canvas id="sc" style="display:none"></canvas>
  <div class="acts"><button class="btn btn-ghost" onclick="cancelScan()">Cancel</button><label class="btn btn-ghost" style="cursor:pointer">Choose image<input type="file" accept="image/*" hidden onchange="fileScan(this)"></label></div>
  <div style="text-align:center;margin-top:12px"><a href="#" style="font:400 13px var(--body);color:var(--info)" onclick="event.preventDefault();onCode('Demo Conveyor|SBD-000000001|Conveyor|Bo')">Use demo ID card</a></div>`);
  startCam();
}
async function startCam(){
  const v=$('sv'),msg=$('smsg');
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    v.srcObject=stream;await v.play();const cv=$('sc');
    const loop=async()=>{if(!stream)return;if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);const t=await decodeCanvas(cv);if(t&&onCode(t))return;}raf=requestAnimationFrame(loop);};
    loop();
  }catch(e){if(msg)msg.textContent='Camera unavailable. Allow camera access, or choose a QR image.';}
}
function fileScan(inp){
  const f=inp.files[0];if(!f)return;const im=new Image();
  im.onload=async()=>{const cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);const t=await decodeCanvas(cv);if(!t)toast('No QR code found in image');else onCode(t);};
  im.src=URL.createObjectURL(f);
}
function signOut(){modal(`<h3>Sign out?</h3><p>${pend()?`<b>${pend()}</b> record(s) are still pending sync. `:''}Records stay saved on this phone.</p><div class="acts"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="closeModal();S.me=null;save();render()">Sign out</button></div>`);}
/* dashboard */
function dash(){
  const today=new Date().toDateString(),T=S.disp.filter(r=>new Date(r.t).toDateString()===today).length;

  <div class="sec">RECENT DISPATCHES</div>${S.disp.length?S.disp.slice(0,5).map(r=>`<div class="card"><div class="kv"><span>${esc(r.id)}</span><span class="chip ${r.synced?'ok':'w'}">${r.synced?'Synced':'Pending'}</span></div><div class="s" style="font:400 13px var(--body);color:var(--muted);margin:6px 0 10px">${esc(r.phu)} · ${qty(r)} ITNs · ${esc(r.plate)}<br>${fmt(r.t)}</div><button class="btn btn-ghost btn-sm btn-block" onclick="openRec('${r.id}')">↓ RECEIPT</button></div>`).join(''):'<div class="card empty">No dispatches yet. Tap DISPATCH to create one.</div>'}`);
}
function openRec(id){ui.rec=id;ui.fresh=false;render();}
/* dispatch */
function grab(){const g=id=>$(id)?$(id).value:undefined,d=ui.d;
  if(ui.step===1){d.district=g('dist');d.chiefdom=g('chf');d.phu=g('phu');d.dual=g('dual');d.std=g('std');}
  if(ui.step===2){d.pre=(g('pre')||'').toUpperCase();d.num=g('num');}}
function dispatch(){
  const d=ui.d;
  if(ui.step===1){
    d.district=d.district||S.me.district;
    const dl=[...new Set([...DISTRICTS,S.me.district])],G=GEO[d.district]||{},ch=Object.keys(G),ph=G[d.chiefdom]||[];
    const opt=(a,v,e)=>`<option value="">${a.length?'Select…':e}</option>`+a.map(c=>`<option ${v===c?'selected':''}>${esc(c)}</option>`).join('');
    shell(`<div class="step">STEP 1 — DESTINATION</div><div class="card">
    <div class="field"><div class="lbl">District <span class="req">*</span></div><select id="dist" onchange="grab();ui.d.chiefdom='';ui.d.phu='';dispatch()">${opt(dl,d.district)}</select></div>
    <div class="field"><div class="lbl">Chiefdom <span class="req">*</span></div><select id="chf" onchange="grab();ui.d.phu='';dispatch()">${opt(ch,d.chiefdom,'No chiefdoms configured')}</select></div>
    <div class="field"><div class="lbl">Health Facility / PHU <span class="req">*</span></div><select id="phu">${opt(ph,d.phu,'Select chiefdom first')}</select></div></div>
    <div class="sec">ITN QUANTITIES</div><div class="card"><div class="field"><div class="lbl">DUAL-AI ITNS</div><input id="dual" type="number" inputmode="numeric" min="0" placeholder="e.g. 500" value="${esc(d.dual??'')}"></div>
    <div class="field"><div class="lbl">STANDARD ITNS</div><input id="std" type="number" inputmode="numeric" min="0" placeholder="e.g. 500" value="${esc(d.std??'')}"></div></div>`,
    `<button class="btn btn-primary" onclick="next1()">NEXT — VEHICLE DETAILS ›</button>`);
  }else if(ui.step===2){
    shell(`<div class="step">STEP 2 — VEHICLE DETAILS</div><div class="card"><div class="lbl">Registration (prefix and number)</div><div class="two field"><input id="pre" maxlength="4" placeholder="DAF" autocapitalize="characters" value="${esc(d.pre||'')}" oninput="plate()" style="width:100%;height:48px;font:16px var(--body);padding:0 14px;border:1px solid var(--field);border-radius:4px;text-transform:uppercase"><input id="num" inputmode="numeric" maxlength="5" placeholder="902" value="${esc(d.num||'')}" oninput="plate()" style="width:100%;height:48px;font:16px var(--body);padding:0 14px;border:1px solid var(--field);border-radius:4px"></div><div style="text-align:center;margin-top:12px"><span class="plate" id="pl">${esc((d.pre||'---')+' - '+(d.num||'000'))}</span></div></div>`,
    `<button class="btn btn-ghost" onclick="grab();ui.step=1;dispatch()">‹ BACK</button><button class="btn btn-primary" onclick="next2()">REVIEW ›</button>`);
  }else{
    shell(`<div class="step">STEP 3 — REVIEW &amp; SUBMIT</div><div class="card">${kv(prev())}</div>`,
    `<button class="btn btn-ghost" onclick="ui.step=2;dispatch()">‹ BACK</button><button class="btn btn-primary" onclick="confirmSub()">SUBMIT DISPATCH</button>`);
  }
}
const plate=()=>{$('pl').textContent=(($('pre').value||'---').toUpperCase())+' - '+($('num').value||'000');};
function prev(){const d=ui.d;return{id:ui.id||(ui.id='DSP-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.floor(1000+Math.random()*9000)),t:ui.t||(ui.t=Date.now()),district:d.district||S.me.district,chiefdom:d.chiefdom,phu:d.phu,dual:+d.dual||0,std:+d.std||0,plate:d.pre+' - '+d.num,conv:S.me.name};}
const kv=r=>[['Dispatch ID',r.id],['Date & Time',fmt(r.t)],['Destination',r.district+' › '+r.chiefdom+' › '+r.phu],['Dual-AI ITNs',r.dual],['Standard ITNs',r.std],['Vehicle Plate',r.plate],['Conveyor',r.conv]].map(x=>`<div class="kv"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('');
function next1(){grab();const d=ui.d;if(!d.district||!d.chiefdom||!d.phu)return toast('Select district, chiefdom and PHU');if(!(+d.dual>0||+d.std>0))return toast('Enter ITN quantities');ui.step=2;dispatch();}
function next2(){grab();const d=ui.d;if(!d.pre||!d.num)return toast('Enter the plate prefix and number');ui.step=3;ui.id=ui.t=null;dispatch();}
function confirmSub(){modal(`<h3>CONFIRM SUBMISSION</h3><p>Submit this dispatch of <b>${(+ui.d.dual||0)+(+ui.d.std||0)}</b> ITNs to <b>${esc(ui.d.phu)}</b>? It cannot be edited afterwards.</p><div class="acts"><button class="btn btn-ghost" onclick="closeModal()">CANCEL</button><button class="btn btn-primary" onclick="submitD()">YES, SUBMIT ✓</button></div>`);}
function submitD(){
  closeModal();const r=prev();r.code=String(Math.floor(100000+Math.random()*900000));r.synced=!ui.off&&navigator.onLine!==false;
  S.disp.unshift(r);save();ui.id=ui.t=null;ui.d={};ui.step=1;ui.rec=r.id;ui.fresh=true;render();
}
/* receipt */
function receipt(){
  const r=S.disp.find(x=>x.id===ui.rec);if(!r){ui.rec=null;return render();}
  shell(`${ui.fresh?'<div class="banner">✓ Dispatch recorded successfully</div>':''}<div class="step">MOVEMENT RECEIPT</div><div class="card">${kv(r)}</div>
  <div class="card"><div class="lbl" style="text-align:center">Dispatch QR Code</div><div class="qrbox">${qrSvg(r)}</div><div class="lbl" style="text-align:center;margin:4px 0">6-digit Verification Code</div><div class="vcode">${r.code}</div><div class="sub" style="text-align:center;margin:8px 0 0">Present to PHU receiving staff to confirm the net count.</div></div>
  <div class="two"><button class="btn btn-ghost btn-sm" onclick="dlQR('${r.id}')">DOWNLOAD QR</button><button class="btn btn-ghost btn-sm" onclick="dlPDF('${r.id}')">DOWNLOAD PDF</button></div>`,
  ui.fresh?`<button class="btn btn-primary" onclick="go('disp')">NEW DISPATCH</button>`:`<button class="btn btn-ghost" onclick="ui.rec=null;render()">‹ BACK</button>`);
}
/* records */
function records(){
  shell(`<div class="sec">ALL DISPATCHES</div>${S.disp.length?`<div class="card">${S.disp.map(r=>`<div class="row" onclick="openRec('${r.id}')" style="cursor:pointer"><span class="sm"><div class="t">${esc(r.id)}</div><div class="s">${esc(r.phu)} · ${fmt(r.t)}</div></span><span class="q">${qty(r)}</span></div>`).join('')}</div>`:'<div class="card empty">No records yet.</div>'}`);
}
/* sync */
function sync(){
  const p=pend();
  shell(`<div class="card"><div class="big">${p}</div><div class="sub" style="text-align:center;margin:6px 0 0">Pending</div></div>
  ${p?'':'<div class="banner">✓ All records synced ✓</div>'}
  <div class="card"><label style="display:flex;align-items:center;gap:10px;font:400 14px var(--body)"><input type="checkbox" ${ui.off?'checked':''} onchange="ui.off=this.checked;toast(ui.off?'Offline mode on':'Back online')"> Simulate no network (testing)</label></div>
  ${p?`<div class="card">${S.disp.filter(r=>!r.synced).map(r=>`<div class="row"><span class="sm"><div class="t">${esc(r.id)}</div><div class="s">${esc(r.phu)}</div></span><span class="chip w">Pending</span></div>`).join('')}</div>`:''}`,
  `<button class="btn btn-primary" ${p?'':'disabled'} onclick="retry()">RETRY ALL PENDING</button>`);
}
function retry(){if(ui.off||navigator.onLine===false)return toast('No network connection');S.disp.forEach(r=>r.synced=true);save();sync();}
render();
</script>
<script>
function fit(){const p=document.querySelector('.phone');p.style.setProperty('--s',Math.min(1,(innerHeight-16)/864,(innerWidth-8)/410));}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
